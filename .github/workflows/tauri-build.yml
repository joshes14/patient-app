name: Build Tauri Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact_name: dental-clinic-windows-exe
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: app
            artifact_name: dental-clinic-macos-dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build ${{ matrix.bundle }} bundle
        run: npm run tauri:build -- --bundles ${{ matrix.bundle }}
        env:
          CI: "true"

      - name: Verify packaged sidecar files (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "next-sidecar.exe" | Select-Object -First 1
          if (-not $sidecar) {
            Write-Error "next-sidecar.exe was not found in packaged bundle output"
            exit 1
          }

          $launcher = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "next-launcher.js" | Select-Object -First 1
          if (-not $launcher) {
            Write-Error "next-launcher.js was not found in packaged bundle resources"
            exit 1
          }

      - name: Re-sign and repack DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run tauri:package:mac

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
