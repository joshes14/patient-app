name: Build Tauri Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact_name: dental-clinic-windows-exe
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: app
            artifact_name: dental-clinic-macos-dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare standalone sidecar assets (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run tauri:prepare

      - name: Build ${{ matrix.bundle }} bundle
        run: npm run tauri:build -- --bundles ${{ matrix.bundle }}
        env:
          CI: "true"

      - name: Verify packaged installer exists (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Windows installer not found under src-tauri/target/release/bundle/nsis"
            exit 1
          }

      - name: Verify sidecar inputs exist (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $runtime = Get-Item "release/next/runtime/node.exe" -ErrorAction SilentlyContinue
          if (-not $runtime) {
            Write-Error "Expected Node runtime not found: release/next/runtime/node.exe"
            exit 1
          }

          $runtimeDll = Get-ChildItem -Path "release/next/runtime" -Filter "*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtimeDll) {
            Write-Error "Expected Node runtime DLL files were not found in release/next/runtime"
            exit 1
          }

          $launcher = Get-Item "release/next/next-launcher.js" -ErrorAction SilentlyContinue
          if (-not $launcher) {
            Write-Error "Expected launcher not found: release/next/next-launcher.js"
            exit 1
          }

          $server = Get-Item "release/next/server/server.js" -ErrorAction SilentlyContinue
          if (-not $server) {
            Write-Error "Expected Next standalone server not found: release/next/server/server.js"
            exit 1
          }

      - name: Re-sign and repack DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run tauri:package:mac

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
