name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "scripts/**"
      - "app/**"
      - "lib/**"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri:build -- --bundles nsis
        env:
          CI: "true"

      - name: Verify generated runtime payload
        shell: pwsh
        run: |
          $runtime = Get-Item "release/next/runtime/node.exe" -ErrorAction SilentlyContinue
          if (-not $runtime) {
            Write-Error "Expected Node runtime not found: release/next/runtime/node.exe"
            exit 1
          }

          $runtimeSupport = Get-ChildItem -Path "release/next/runtime" -Include "*.dll", "*.dat" -File -ErrorAction SilentlyContinue
          if (-not $runtimeSupport) {
            Write-Host "No extra Node support files found in release/next/runtime (this can be normal on Node 20 for Windows)."
          }

          $launcher = Get-Item "release/next/next-launcher.js" -ErrorAction SilentlyContinue
          if (-not $launcher) {
            Write-Error "Expected launcher not found: release/next/next-launcher.js"
            exit 1
          }

          $server = Get-Item "release/next/server/server.js" -ErrorAction SilentlyContinue
          if (-not $server) {
            Write-Error "Expected Next standalone server not found: release/next/server/server.js"
            exit 1
          }

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Windows installer not found under src-tauri/target/release/bundle/nsis"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dental-clinic-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
